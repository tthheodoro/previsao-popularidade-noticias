name: Ingestão Diária de Notícias (Web RSS)

on:
  schedule:
    # Corre todos os dias às 09:00 e às 18:00 (Hora UTC)
    - cron: "0 9,18 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Motor de Aquisição de Notícias
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.analysis.dados_portugal
