name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Migrate binary files to LFS
        run: |
          git lfs install
          git lfs migrate import --include="*.pkl,*.db,*.png" --everything

      - name: Verify LFS tracking
        run: git lfs ls-files

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://previsao:$HF_TOKEN@huggingface.co/spaces/previsao/previsao main
